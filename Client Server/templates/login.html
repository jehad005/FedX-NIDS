<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Lamp Login · SecureFed Edge Node</title>
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://iconsax.gitlab.io/i/icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --lamp-shade: #729679;
            --lamp-shade-dark: #58785e;
            --lamp-glow: rgba(34, 197, 94, 0.45);
            --card-glow: 0 0 45px -5px rgba(34, 197, 94, 0.42), 0 20px 40px -15px rgba(0, 0, 0, 0.8);
            --cord: #cbd5e1;
            --tongue: #f43f5e;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #090d13;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.45s ease;
        }

        /* Ambient Room Lighting linked to Lamp state */
        .room-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), background 0.55s ease;
            background: radial-gradient(circle at 35% 45%, rgba(34, 197, 94, 0.16) 0%, rgba(14, 165, 233, 0.08) 45%, transparent 75%);
            z-index: 0;
        }

        body.lamp-off .room-ambient {
            opacity: 0.08;
            background: radial-gradient(circle at 35% 45%, rgba(15, 23, 42, 0.2) 0%, transparent 60%);
        }

        /* Light Beam Projected from Lamp Bottom */
        .light-beam {
            position: absolute;
            top: 178px;
            left: 20px;
            width: 200px;
            height: 250px;
            clip-path: polygon(32% 0%, 68% 0%, 100% 100%, 0% 100%);
            background: linear-gradient(to bottom, rgba(255, 255, 240, 0.65) 0%, rgba(255, 255, 230, 0.18) 45%, rgba(34, 197, 94, 0.05) 80%, transparent 100%);
            filter: blur(2.5px);
            pointer-events: none;
            transition: opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1), transform 0.38s ease;
            transform-origin: top center;
            z-index: 5;
        }

        body.lamp-off .light-beam {
            opacity: 0;
            transform: scaleY(0.7);
        }

        /* Surface Spotlight Reflection */
        .spotlight-floor {
            position: absolute;
            bottom: -15px;
            left: 10px;
            width: 220px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255, 255, 230, 0.45) 0%, rgba(34, 197, 94, 0.25) 45%, transparent 75%);
            filter: blur(6px);
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 4;
        }

        body.lamp-off .spotlight-floor {
            opacity: 0;
        }

        /* The Pull Cord Animation */
        .pull-cord {
            cursor: pointer;
            transform-origin: top center;
            transition: transform 0.14s ease-out;
        }

        .pull-cord:active, .pull-cord.is-pulling {
            transform: translateY(20px) scaleY(1.18);
        }

        .cord-line {
            stroke: #cbd5e1;
            stroke-width: 2.2;
            stroke-linecap: round;
        }

        .cord-bead {
            fill: #f1f5f9;
            stroke: #94a3b8;
            stroke-width: 1.5;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: transform 0.15s ease, fill 0.15s ease;
        }

        .pull-cord:hover .cord-bead {
            fill: #38bdf8;
            transform: scale(1.22);
        }

        /* Lamp Face Expression States */
        .face-eyes-open {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .face-eyes-closed {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        body.lamp-off .face-eyes-open {
            opacity: 0;
            transform: scaleY(0.2);
        }
        body.lamp-off .face-eyes-closed {
            opacity: 1;
        }

        /* Shy Eyes when typing Password */
        body.is-shy .lamp-pupil {
            transform: translate(6px, -4px) !important;
        }
        body.is-shy .lamp-blush {
            transform: scale(1.35) !important;
            opacity: 0.9 !important;
        }

        /* ======================================================== */
        /* LOGIN INTERFACE APPEAR / DISAPPEAR REACTION (Key Feature)*/
        /* ======================================================== */
        .login-stage-container {
            position: relative;
            min-height: 440px;
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* When Lamp is ON: Login Interface Appears with Green Neon Glow */
        .cute-login-card {
            background: #141922;
            border: 1.5px solid rgba(34, 197, 94, 0.55);
            border-radius: 28px;
            box-shadow: 
                0 0 35px -5px rgba(34, 197, 94, 0.45),
                0 0 15px -3px rgba(34, 197, 94, 0.3),
                0 25px 60px -15px rgba(0, 0, 0, 0.85);
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
            position: relative;
            width: 100%;
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            visibility: visible;
        }

        /* When Lamp is OFF: Login Interface Completely Vanishes! */
        body.lamp-off .cute-login-card {
            opacity: 0 !important;
            transform: scale(0.9) translateY(24px) !important;
            pointer-events: none !important;
            visibility: hidden !important;
            box-shadow: none !important;
        }

        /* Placeholder shown in the dark when light is off */
        .dark-sleep-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s ease, visibility 0.4s;
            border: 1.5px dashed rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 2.2rem 1.8rem;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(12px);
        }

        body.lamp-off .dark-sleep-placeholder {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        /* Input Controls */
        .cute-input {
            background: #1c232d;
            border: 1px solid #283341;
            color: #f1f5f9;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .cute-input:focus {
            background: #202936;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            outline: none;
        }

        /* Green Submit Button */
        .cute-btn-green {
            background: #22c55e;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 4px 18px -2px rgba(34, 197, 94, 0.45);
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cute-btn-green:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 25px -4px rgba(34, 197, 94, 0.65);
            filter: brightness(1.06);
        }

        .cute-btn-green:active {
            transform: translateY(0) scale(0.98);
        }

        /* Floating Click Hint on Cord */
        .cord-hint {
            animation: pulseHint 2.2s infinite ease-in-out;
        }

        @keyframes pulseHint {
            0%, 100% { transform: translateY(0); opacity: 0.85; }
            50% { transform: translateY(4px); opacity: 1; }
        }
    </style>
</head>

    <!-- Audio Element for Tactile Cord Snap Sound (Synthesized with Web Audio API) -->
    <script>
        // Web Audio Synthesizer for realistic tactile cord switch "click" sound
        function playCordClickSound(isTurningOn) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = isTurningOn ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(isTurningOn ? 880 : 440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isTurningOn ? 220 : 180, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.28, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                // AudioContext fallback
            }
        }

        // Start with Lamp OFF so the user gets the magical experience of pulling the cord to reveal the login interface
        let isLampOn = false;

        function toggleLamp() {
            isLampOn = !isLampOn;
            playCordClickSound(isLampOn);

            const cordHintText = document.getElementById('cord-hint-text');
            const lampStatusText = document.getElementById('lamp-status-text');

            if (isLampOn) {
                // LIGHT TURNS ON -> LOGIN INTERFACE EMERGES!
                document.body.classList.remove('lamp-off');
                if (lampStatusText) lampStatusText.textContent = 'Lamp: ON';
                if (cordHintText) cordHintText.textContent = 'Pull Cord to Turn Off';
            } else {
                // LIGHT TURNS OFF -> LOGIN INTERFACE VANISHES!
                document.body.classList.add('lamp-off');
                if (lampStatusText) lampStatusText.textContent = 'Lamp: OFF (Click Cord)';
                if (cordHintText) cordHintText.textContent = 'Pull Cord to Turn On';
            }
        }

        function pullCordAction(e) {
            if (e) e.stopPropagation();
            const cord = document.getElementById('pull-cord');
            cord.classList.add('is-pulling');
            setTimeout(() => {
                cord.classList.remove('is-pulling');
                toggleLamp();
            }, 120);
        }

        // Cute Lamp Interactive Reactions
        function handlePasswordFocus() {
            document.body.classList.add('is-shy');
        }

        function handlePasswordBlur() {
            document.body.classList.remove('is-shy');
        }

        function handleUsernameFocus() {
            const pupils = document.querySelectorAll('.lamp-pupil');
            pupils.forEach(p => p.setAttribute('transform', 'translate(0, 1)'));
        }

        function handleUsernameBlur() {
            const pupils = document.querySelectorAll('.lamp-pupil');
            pupils.forEach(p => p.removeAttribute('transform'));
        }

        function togglePasswordView() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.setAttribute('icon-name', 'eye-slash');
            } else {
                pwd.type = 'password';
                icon.setAttribute('icon-name', 'eye');
            }
        }

        function fillDemoCredentials() {
            document.getElementById('username').value = 'client_node_01';
            document.getElementById('password').value = 'securefed-admin-token-2026';
            showAlert('info', 'Demo credentials loaded: client_node_01 & default admin token.');
        }

        function showTokenHint() {
            showAlert('info', 'Default Admin Secret Token is: securefed-admin-token-2026');
        }

        function showAlert(type, msg) {
            const box = document.getElementById('login-alert');
            const text = document.getElementById('login-alert-text');
            const icon = document.getElementById('login-alert-icon');
            box.classList.remove('hidden', 'bg-red-500/15', 'border-red-500/30', 'text-red-300', 'bg-emerald-500/15', 'border-emerald-500/30', 'text-emerald-300', 'bg-blue-500/15', 'border-blue-500/30', 'text-blue-300');

            if (type === 'error') {
                box.classList.add('bg-red-500/15', 'border-red-500/30', 'text-red-300');
                icon.setAttribute('icon-name', 'danger');
            } else if (type === 'success') {
                box.classList.add('bg-emerald-500/15', 'border-emerald-500/30', 'text-emerald-300');
                icon.setAttribute('icon-name', 'tick-circle');
            } else {
                box.classList.add('bg-blue-500/15', 'border-blue-500/30', 'text-blue-300');
                icon.setAttribute('icon-name', 'info-circle');
            }
            text.textContent = msg;
        }

        async function handleCuteLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const remember = document.getElementById('remember-me').checked;
            const btn = document.getElementById('login-btn');
            const label = document.getElementById('login-btn-label');

            if (!password) {
                showAlert('error', 'Please enter your password / Admin Secret Key.');
                return;
            }

            btn.disabled = true;
            label.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/client/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        admin_key: password,
                        remember: remember
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    sessionStorage.setItem('securefed_admin_key', password);
                    sessionStorage.setItem('securefed_operator_user', username);
                    if (remember) {
                        localStorage.setItem('securefed_saved_operator', username);
                        localStorage.setItem('securefed_saved_admin_key', password);
                    }
                    showAlert('success', `${data.message} Redirecting...`);
                    label.textContent = '✓ Welcome!';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    showAlert('error', data.detail || 'Authentication failed. Please verify your password / Admin Secret Key.');
                    btn.disabled = false;
                    label.textContent = 'Login';
                }
            } catch (err) {
                showAlert('error', `Connection error: ${err.message}`);
                btn.disabled = false;
                label.textContent = 'Login';
            }
        }

        // Restore saved credentials if available
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('securefed_saved_operator') || sessionStorage.getItem('securefed_operator_user');
            const savedKey = localStorage.getItem('securefed_saved_admin_key') || sessionStorage.getItem('securefed_admin_key');
            if (savedUser) document.getElementById('username').value = savedUser;
            if (savedKey) document.getElementById('password').value = savedKey;
        });
    </script>
</body>
</html>
